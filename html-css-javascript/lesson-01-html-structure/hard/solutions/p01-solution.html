<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accessible Full Page</title>
<style>
  .skip-link { position: absolute; left: -9999px; }
  .skip-link:focus { left: 10px; top: 10px; background: #fff; padding: 8px; z-index: 100; }
  a:focus, button:focus { outline: 3px solid #00f; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<header>
  <nav aria-label="Main navigation">
    <ul><li><a href="/">Home</a></li><li><a href="/about">About</a></li></ul>
  </nav>
</header>
<main id="main">
  <h1>Welcome</h1>
  <p>This is an accessible page with landmarks and ARIA.</p>
  <img src="https://picsum.photos/200" alt="A scenic landscape photo">
  <img src="https://picsum.photos/200" alt="">
</main>
<footer><p>&copy; 2024 My Site</p></footer>
</body>
</html>
