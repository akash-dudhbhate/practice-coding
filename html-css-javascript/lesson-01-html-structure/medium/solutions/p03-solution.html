<head><meta charset="UTF-8"><title>Definition List - Glossary</title></head>
<body>
<dl>
  <dt>HTML</dt>
  <dd>HyperText Markup Language - the standard markup language for web pages.</dd>
  <dt>CSS</dt>
  <dd>Cascading Style Sheets - used for styling web pages.</dd>
  <dt>JavaScript</dt>
  <dd>A programming language that enables interactive web pages.</dd>
  <dt>API</dt>
  <dd>Application Programming Interface - a set of rules for interacting with software.</dd>
</dl>
</body>
