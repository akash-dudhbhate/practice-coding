<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>3-Column Table</title></head>
<body>
<table border="1">
  <thead><tr><th>Name</th><th>Age</th><th>City</th></tr></thead>
  <tbody>
    <tr><td>Alice</td><td>30</td><td>Mumbai</td></tr>
    <tr><td>Bob</td><td>25</td><td>Delhi</td></tr>
    <tr><td>Charlie</td><td>35</td><td>Pune</td></tr>
  </tbody>
</table>
</body>
</html>
