<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Drop Cap Article</title>
<style>
  article { max-width: 600px; margin: 20px; font-family: Georgia, serif; line-height: 1.6; }
  article p::first-letter { font-size: 3em; float: left; line-height: 1; margin-right: 8px; color: #667eea; font-weight: bold; }
  article p::first-line { text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<article>
  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p>
</article>
</body>
</html>
