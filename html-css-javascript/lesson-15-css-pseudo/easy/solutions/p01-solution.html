<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Hover Effects</title>
<style>
  a { text-decoration: none; margin: 0 10px; font-size: 18px; transition: all 0.3s; }
  .color:hover { color: red; }
  .underline:hover { text-decoration: underline; }
  .scale:hover { display: inline-block; transform: scale(1.2); }
</style>
</head>
<body>
<a href="#" class="color">Color change</a>
<a href="#" class="underline">Underline</a>
<a href="#" class="scale">Scale up</a>
</body>
</html>
