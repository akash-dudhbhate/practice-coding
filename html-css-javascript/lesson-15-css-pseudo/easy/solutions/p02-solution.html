<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Zebra Striped List</title>
<style>
  li { padding: 8px 12px; }
  li:nth-child(even) { background: #f0f0f0; }
  li:nth-child(odd) { background: #fff; }
  li:first-child { font-weight: bold; border-top: 2px solid #333; }
  li:last-child { border-bottom: 2px solid #333; }
</style>
</head>
<body>
<ul>
  <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li><li>Item 5</li>
</ul>
</body>
</html>
