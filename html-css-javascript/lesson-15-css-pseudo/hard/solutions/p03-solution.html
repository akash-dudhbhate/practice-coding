<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Nav with CSS Effects</title>
<style>
  nav { background: #333; padding: 16px 20px; }
  nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
  nav a {
    color: #fff; text-decoration: none; position: relative; padding-bottom: 4px;
  }
  nav a::after {
    content: ""; position: absolute; bottom: 0; left: 0; width: 100%;
    height: 2px; background: #667eea; transform: scaleX(0); transition: transform 0.3s;
  }
  nav a:hover::after { transform: scaleX(1); }
  nav a:target::after { transform: scaleX(1); }
  .badge-item a::after {
    content: "3"; background: #e74c3c; color: #fff; font-size: 10px;
    padding: 2px 6px; border-radius: 10px; position: absolute; top: -8px; right: -20px;
    width: auto; height: auto; transform: none; transition: none;
  }
</style>
</head>
<body>
<nav>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li class="badge-item"><a href="#msg">Messages</a></li>
    <li><a href="#settings">Settings</a></li>
  </ul>
</nav>
</body>
</html>
