<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Custom Checkbox & Radio</title>
<style>
  input[type="checkbox"], input[type="radio"] { display: none; }
  .check-label, .radio-label { display: inline-flex; align-items: center; cursor: pointer; margin: 8px; }
  .check-label::before {
    content: ""; width: 20px; height: 20px; border: 2px solid #667eea;
    border-radius: 4px; margin-right: 8px; transition: background 0.2s;
  }
  input:checked + .check-label::before { background: #667eea; }
  input:checked + .check-label::after {
    content: "\2713"; color: #fff; margin-left: -28px; margin-right: 8px;
    font-size: 14px; line-height: 20px; width: 20px; text-align: center;
  }
  .radio-label::before {
    content: ""; width: 20px; height: 20px; border: 2px solid #667eea;
    border-radius: 50%; margin-right: 8px; transition: background 0.2s;
  }
  input:checked + .radio-label::before { background: #667eea; box-shadow: inset 0 0 0 4px #fff; }
  .check-label:hover::before, .radio-label:hover::before { border-color: #764ba2; }
</style>
</head>
<body>
<input type="checkbox" id="c1"><label for="c1" class="check-label">Option 1</label>
<input type="checkbox" id="c2"><label for="c2" class="check-label">Option 2</label>
<br>
<input type="radio" name="r" id="r1"><label for="r1" class="radio-label">Choice A</label>
<input type="radio" name="r" id="r2"><label for="r2" class="radio-label">Choice B</label>
</body>
</html>
