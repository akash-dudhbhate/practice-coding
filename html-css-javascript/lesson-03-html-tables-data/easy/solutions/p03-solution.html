<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Styled Table</title>
<style>
  table { border-collapse: collapse; width: 50%; }
  th, td { border: 1px solid #333; padding: 8px 12px; text-align: left; }
  th { background: #f0f0f0; }
</style>
</head>
<body>
<table>
  <tr><th>Name</th><th>Age</th><th>City</th></tr>
  <tr><td>Alice</td><td>30</td><td>Mumbai</td></tr>
  <tr><td>Bob</td><td>25</td><td>Delhi</td></tr>
</table>
</body>
</html>
