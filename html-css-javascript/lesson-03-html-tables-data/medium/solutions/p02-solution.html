<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Colgroup Table</title></head>
<body>
<table border="1">
  <caption>Product Sales</caption>
  <colgroup>
    <col style="width: 50%">
    <col style="width: 25%">
    <col style="width: 25%">
  </colgroup>
  <tr><th>Product</th><th>Price</th><th>Stock</th></tr>
  <tr><td>Widget A</td><td>$10</td><td>50</td></tr>
  <tr><td>Widget B</td><td>$20</td><td>30</td></tr>
</table>
</body>
</html>
