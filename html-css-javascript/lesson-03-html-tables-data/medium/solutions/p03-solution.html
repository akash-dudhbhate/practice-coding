<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Colspan and Rowspan</title></head>
<body>
<table border="1">
  <tr>
    <th colspan="2">Name</th>
    <th rowspan="2">Age</th>
  </tr>
  <tr>
    <th>First</th><th>Last</th>
  </tr>
  <tr><td>Alice</td><td>Smith</td><td>30</td></tr>
  <tr><td>Bob</td><td>Jones</td><td>25</td></tr>
</table>
</body>
</html>
