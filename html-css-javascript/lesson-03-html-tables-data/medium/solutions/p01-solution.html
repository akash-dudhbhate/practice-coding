<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Financial Table</title></head>
<body>
<table border="1">
  <thead>
    <tr><th scope="col">Item</th><th scope="col">Q1</th><th scope="col">Q2</th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Revenue</th><td>1000</td><td>1500</td></tr>
    <tr><th scope="row">Expenses</th><td>800</td><td>900</td></tr>
  </tbody>
  <tfoot>
    <tr><th scope="row">Profit</th><td>200</td><td>600</td></tr>
  </tfoot>
</table>
</body>
</html>
