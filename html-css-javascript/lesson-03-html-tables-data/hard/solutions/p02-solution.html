<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Comparison Table</title>
<style>
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #555; padding: 10px; text-align: center; }
  th { background: #ddd; }
</style>
</head>
<body>
<table>
  <tr>
    <th rowspan="2">Feature</th>
    <th colspan="2">Plan</th>
  </tr>
  <tr><th scope="col">Basic</th><th scope="col">Pro</th></tr>
  <tr><th scope="row">Storage</th><td>5GB</td><td>50GB</td></tr>
  <tr><th scope="row">Users</th><td>3</td><td>Unlimited</td></tr>
  <tr><th scope="row">Support</th><td>Email</td><td>24/7</td></tr>
</table>
</body>
</html>
