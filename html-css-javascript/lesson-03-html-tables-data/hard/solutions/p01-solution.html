<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quarterly Sales Report</title>
<style>
  table { border-collapse: collapse; width: 80%; }
  th, td { border: 1px solid #333; padding: 8px; }
  th { background: #e0e0e0; }
  tbody tr:nth-child(odd) { background: #f9f9f9; }
</style>
</head>
<body>
<table>
  <caption>Quarterly Sales Report 2024</caption>
  <colgroup><col><col><col><col><col></colgroup>
  <thead>
    <tr><th scope="col">Product</th><th scope="col">Q1</th><th scope="col">Q2</th><th scope="col">Q3</th><th scope="col">Total</th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Widget A</th><td>100</td><td>150</td><td>200</td><td>450</td></tr>
    <tr><th scope="row">Widget B</th><td>80</td><td>120</td><td>90</td><td>290</td></tr>
  </tbody>
  <tfoot>
    <tr><th scope="row">Total</th><td>180</td><td>270</td><td>290</td><td>740</td></tr>
  </tfoot>
</table>
</body>
</html>
