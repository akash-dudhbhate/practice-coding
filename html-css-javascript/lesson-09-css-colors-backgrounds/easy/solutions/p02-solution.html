<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Background Image with Overlay</title>
<style>
  .card {
    position: relative;
    width: 300px; height: 200px;
    background: url("https://picsum.photos/300/200") center/cover;
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
<div class="card"></div>
</body>
</html>
