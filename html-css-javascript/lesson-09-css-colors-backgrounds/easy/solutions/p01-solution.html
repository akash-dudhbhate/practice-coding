<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>3 Color Formats</title>
<style>
  .box1 { width: 100px; height: 100px; display: inline-block; background: #ff6600; }
  .box2 { width: 100px; height: 100px; display: inline-block; background: rgb(0, 128, 255); }
  .box3 { width: 100px; height: 100px; display: inline-block; background: hsl(120, 100%, 50%); }
</style>
</head>
<body>
<div class="box1"></div>
<div class="box2"></div>
<div class="box3"></div>
</body>
</html>
