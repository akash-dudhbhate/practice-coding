<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Media Landing Page</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  header { background: #222; color: #fff; padding: 20px; text-align: center; }
  .hero video { width: 100%; max-height: 400px; object-fit: cover; }
  .gallery { display: flex; gap: 10px; padding: 20px; flex-wrap: wrap; }
  .gallery img { width: 200px; height: 150px; object-fit: cover; }
  footer { background: #eee; padding: 10px; text-align: center; }
</style>
</head>
<body>
<header><h1>Media Landing Page</h1></header>
<section class="hero">
  <video autoplay muted loop>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>
</section>
<section class="gallery">
  <img src="https://picsum.photos/200/150" alt="Gallery 1">
  <img src="https://picsum.photos/200/150" alt="Gallery 2">
  <img src="https://picsum.photos/200/150" alt="Gallery 3">
</section>
<footer><p>&copy; 2024 Media Page</p></footer>
</body>
</html>
