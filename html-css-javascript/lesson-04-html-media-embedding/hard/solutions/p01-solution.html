<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Video Gallery with Captions</title></head>
<body>
<h2>Video Gallery</h2>
<figure>
  <video controls width="300">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    <track kind="subtitles" srclang="en" label="English">
  </video>
  <figcaption>Big Buck Bunny - Sample</figcaption>
</figure>
<figure>
  <video controls width="300">
    <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
  </video>
  <figcaption>Sample Movie</figcaption>
</figure>
</body>
</html>
