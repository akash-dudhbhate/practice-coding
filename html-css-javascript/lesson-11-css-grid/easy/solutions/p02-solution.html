<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>2x3 Grid with Row Heights</title>
<style>
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 100px 200px 100px;
    gap: 10px; padding: 20px;
  }
  .item { background: #764ba2; color: #fff; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="item">1</div><div class="item">2</div>
  <div class="item">3</div><div class="item">4</div>
  <div class="item">5</div><div class="item">6</div>
</div>
</body>
</html>
