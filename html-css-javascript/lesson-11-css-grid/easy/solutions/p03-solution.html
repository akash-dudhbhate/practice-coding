<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Responsive Auto-fit Grid</title>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px; padding: 20px;
  }
  .card { padding: 20px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">Card 1</div><div class="card">Card 2</div>
  <div class="card">Card 3</div><div class="card">Card 4</div>
  <div class="card">Card 5</div><div class="card">Card 6</div>
  <div class="card">Card 7</div><div class="card">Card 8</div>
</div>
</body>
</html>
