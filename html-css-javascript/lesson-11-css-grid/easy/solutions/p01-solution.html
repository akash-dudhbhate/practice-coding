<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>3-Column Grid</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
  .item { padding: 20px; background: #667eea; color: #fff; text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="item">1</div><div class="item">2</div><div class="item">3</div>
  <div class="item">4</div><div class="item">5</div><div class="item">6</div>
</div>
</body>
</html>
