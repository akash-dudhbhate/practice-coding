<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Photo Gallery</title>
<style>
  .gallery { display: grid; gap: 10px; padding: 20px; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
  @media (min-width: 768px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1024px) {
    .gallery { grid-template-columns: repeat(4, 1fr); }
  }
  .wide { grid-column: span 2; }
</style>
</head>
<body>
<div class="gallery">
  <img class="wide" src="https://picsum.photos/400/200" alt="1">
  <img src="https://picsum.photos/200/200" alt="2">
  <img src="https://picsum.photos/200/200" alt="3">
  <img class="wide" src="https://picsum.photos/400/200" alt="4">
  <img src="https://picsum.photos/200/200" alt="5">
  <img src="https://picsum.photos/200/200" alt="6">
</div>
</body>
</html>
