<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dashboard Layout</title>
<style>
  .dashboard {
    display: grid;
    grid-template-areas: "header header" "sidebar widgets";
    grid-template-columns: 250px 1fr;
    grid-template-rows: 60px 1fr;
    min-height: 100vh;
  }
  header { grid-area: header; background: #333; color: #fff; padding: 16px; }
  aside { grid-area: sidebar; background: #f0f0f0; padding: 20px; }
  .widgets { grid-area: widgets; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; padding: 20px; }
  .widget { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
</style>
</head>
<body>
<div class="dashboard">
  <header>Dashboard Header</header>
  <aside>Sidebar</aside>
  <div class="widgets">
    <div class="widget">Widget 1</div>
    <div class="widget">Widget 2</div>
    <div class="widget">Widget 3</div>
    <div class="widget">Widget 4</div>
  </div>
</div>
</body>
</html>
