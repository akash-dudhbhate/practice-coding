<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Responsive Dashboard</title>
<style>
  .dashboard { display: grid; grid-template-areas: "sidebar header" "sidebar content"; grid-template-columns: 250px 1fr; grid-template-rows: 60px 1fr; min-height: 100vh; }
  header { grid-area: header; background: #333; color: #fff; padding: 16px; }
  aside { grid-area: sidebar; background: #f0f0f0; padding: 20px; }
  .content { grid-area: content; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px; }
  .widget { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
  @media (max-width: 1024px) {
    .dashboard { grid-template-areas: "header" "content"; grid-template-columns: 1fr; }
    aside { display: none; }
    .content { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) { .content { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="dashboard">
  <header>Dashboard</header>
  <aside>Sidebar</aside>
  <div class="content">
    <div class="widget">W1</div><div class="widget">W2</div>
    <div class="widget">W3</div><div class="widget">W4</div>
  </div>
</div>
</body>
</html>
