<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Magazine Layout</title>
<style>
  .magazine {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 200px);
    gap: 16px; padding: 20px;
  }
  .article { background: #f0f0f0; border-radius: 8px; padding: 20px; }
  .featured { grid-column: span 2; grid-row: span 2; background: #667eea; color: #fff; }
</style>
</head>
<body>
<div class="magazine">
  <div class="article featured"><h2>Featured Article</h2></div>
  <div class="article">Article 2</div>
  <div class="article">Article 3</div>
  <div class="article">Article 4</div>
  <div class="article">Article 5</div>
</div>
</body>
</html>
