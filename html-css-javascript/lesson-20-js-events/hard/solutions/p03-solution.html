<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Infinite Scroll</title>
<style>
  .item { padding: 20px; margin: 10px; background: #f0f0f0; border-radius: 8px; }
  #loading { text-align: center; padding: 20px; display: none; }
</style>
</head>
<body>
<div id="container"></div>
<div id="loading">Loading more...</div>
<script>
  let count = 0;
  let loading = false;
  const container = document.getElementById("container");
  const loadingEl = document.getElementById("loading");

  function loadMore() {
    if (loading) return;
    loading = true;
    loadingEl.style.display = "block";
    setTimeout(() => {
      for (let i = 0; i < 5; i++) {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `Item ${++count}`;
        container.appendChild(div);
      }
      loading = false;
      loadingEl.style.display = "none";
    }, 500);
  }

  function onScroll() {
    if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 100) {
      loadMore();
    }
  }

  window.addEventListener("scroll", onScroll);
  loadMore(); // initial load

  // To clean up: window.removeEventListener("scroll", onScroll);
</script>
</body>
</html>
