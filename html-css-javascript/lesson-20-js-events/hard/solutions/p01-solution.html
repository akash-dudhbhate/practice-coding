<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dropdown Menu</title>
<style>
  .dropdown { position: relative; display: inline-block; }
  .dropdown-btn { padding: 8px 16px; background: #667eea; color: #fff; border: none; cursor: pointer; }
  .dropdown-menu {
    display: none; position: absolute; top: 100%; left: 0;
    background: #fff; border: 1px solid #ddd; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    min-width: 150px; z-index: 10;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu a { display: block; padding: 8px 16px; text-decoration: none; color: #333; }
  .dropdown-menu a:hover { background: #f0f0f0; }
</style>
</head>
<body>
<div class="dropdown" id="dropdown">
  <button class="dropdown-btn">Menu</button>
  <div class="dropdown-menu">
    <a href="#">Option 1</a><a href="#">Option 2</a><a href="#">Option 3</a>
  </div>
</div>
<script>
  const dd = document.getElementById("dropdown");
  dd.querySelector(".dropdown-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    dd.classList.toggle("open");
  });
  document.addEventListener("click", () => dd.classList.remove("open"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") dd.classList.remove("open"); });
</script>
</body>
</html>
