<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Event Delegation</title></head>
<body>
<ul id="list">
  <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li><li>Item 5</li>
</ul>
<script>
  document.getElementById("list").addEventListener("click", (e) => {
    if (e.target.tagName === "LI") console.log("Clicked:", e.target.textContent);
  });
</script>
</body>
</html>
