<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Accessible Form</title></head>
<body>
<form>
  <fieldset>
    <legend>Login</legend>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" aria-required="true" required><br><br>
    <label for="pwd">Password:</label>
    <input type="password" id="pwd" name="pwd" aria-required="true" required><br><br>
    <button type="submit">Login</button>
  </fieldset>
</form>
</body>
</html>
