<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Full Page Layout</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100vh; }
  header { position: sticky; top: 0; background: #333; color: #fff; padding: 16px; z-index: 10; }
  .body { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 250px; background: #f0f0f0; padding: 20px; overflow-y: auto; }
  .content { flex: 1; padding: 20px; overflow-y: auto; }
  footer { position: sticky; bottom: 0; background: #333; color: #fff; padding: 12px; }
</style>
</head>
<body>
<header>Header</header>
<div class="body">
  <aside class="sidebar">Sidebar</aside>
  <main class="content">Scrollable content area</main>
</div>
<footer>Footer</footer>
</body>
</html>
