<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Navbar</title>
<style>
  .navbar { display: flex; justify-content: space-between; padding: 12px 20px; background: #333; }
  .navbar a { color: #fff; text-decoration: none; margin-left: 16px; }
  .logo { color: #fff; font-weight: bold; }
  .nav-links { display: flex; gap: 16px; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">MyBrand</div>
  <div class="nav-links">
    <a href="#">Home</a><a href="#">About</a><a href="#">Contact</a>
  </div>
</nav>
</body>
</html>
