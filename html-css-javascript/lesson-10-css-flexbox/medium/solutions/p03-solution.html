<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Product Card Responsive</title>
<style>
  .product { display: flex; gap: 16px; padding: 20px; }
  .product img { width: 200px; height: 200px; object-fit: cover; }
  .details { flex: 1; }
  @media (max-width: 600px) {
    .product { flex-direction: column; align-items: center; }
    .product img { width: 100%; height: auto; }
  }
</style>
</head>
<body>
<div class="product">
  <img src="https://picsum.photos/200" alt="Product">
  <div class="details">
    <h2>Product Name</h2>
    <p>$49.99</p>
    <p>Product description here.</p>
    <button>Add to Cart</button>
  </div>
</div>
</body>
</html>
