<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Wrapping Card Grid</title>
<style>
  .grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 20px; }
  .card { flex: 1 1 300px; min-width: 300px; padding: 20px; background: #f0f0f0; border: 1px solid #ddd; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">Card 1</div>
  <div class="card">Card 2</div>
  <div class="card">Card 3</div>
  <div class="card">Card 4</div>
  <div class="card">Card 5</div>
</div>
</body>
</html>
