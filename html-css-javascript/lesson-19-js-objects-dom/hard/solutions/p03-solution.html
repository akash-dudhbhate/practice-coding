<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Modal Component</title>
<style>
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: #fff; padding: 24px; border-radius: 8px; min-width: 300px;
    transform: scale(0.9); transition: transform 0.3s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .close-btn { float: right; cursor: pointer; font-size: 20px; border: none; background: none; }
</style>
</head>
<body>
<button id="openBtn">Open Modal</button>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="closeBtn">&times;</button>
    <h2>Modal Title</h2>
    <p>Modal content goes here.</p>
  </div>
</div>
<script>
  const overlay = document.getElementById("modalOverlay");
  document.getElementById("openBtn").addEventListener("click", () => overlay.classList.add("open"));
  document.getElementById("closeBtn").addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
</script>
</body>
</html>
