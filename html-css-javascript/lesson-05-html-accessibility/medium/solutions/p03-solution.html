<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Accessible Table</title></head>
<body>
<table border="1">
  <caption>Monthly Sales by Region</caption>
  <thead>
    <tr><th scope="col">Region</th><th scope="col">Jan</th><th scope="col">Feb</th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">North</th><td>100</td><td>120</td></tr>
    <tr><th scope="row">South</th><td>80</td><td>95</td></tr>
    <tr><th scope="row">East</th><td>110</td><td>130</td></tr>
  </tbody>
</table>
</body>
</html>
