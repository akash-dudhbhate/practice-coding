<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Accessible Nav Menu</title>
<style>
  .skip-link { position: absolute; left: -9999px; }
  .skip-link:focus { left: 10px; top: 10px; background: #fff; padding: 8px; }
  nav a:focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
  nav a[aria-current="page"] { font-weight: bold; text-decoration: underline; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<nav aria-label="Primary">
  <ul>
    <li><a href="/" aria-current="page">Home</a></li>
    <li><a href="/products">Products</a></li>
    <li><a href="/support">Support</a></li>
  </ul>
</nav>
<main id="main"><h1>Home</h1></main>
</body>
</html>
