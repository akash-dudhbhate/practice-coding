<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Accessible Form</title></head>
<body>
<form>
  <label for="name">Name</label>
  <input type="text" id="name" name="name" aria-describedby="name-hint">
  <p id="name-hint">Enter your full name.</p>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" aria-describedby="email-hint">
  <p id="email-hint">We never share your email.</p>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" aria-describedby="phone-hint">
  <p id="phone-hint">Optional — for delivery updates only.</p>

  <button type="submit">Submit</button>
</form>
</body>
</html>
