<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Accessible Images</title></head>
<body>
<!-- Meaningful image: descriptive alt -->
<img src="https://picsum.photos/200" alt="A mountain lake at sunrise">
<!-- Decorative image: empty alt so screen readers skip it -->
<img src="https://picsum.photos/200" alt="">
<!-- Linked image: alt describes the destination -->
<a href="/gallery"><img src="https://picsum.photos/200" alt="View the photo gallery"></a>
</body>
</html>
