<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Container</title>
<style>
  .container { width: 100%; padding: 20px; box-sizing: border-box; }
  @media (min-width: 768px) {
    .container { max-width: 1200px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="container"><p>Full-width on mobile, max 1200px centered on desktop.</p></div>
</body>
</html>
