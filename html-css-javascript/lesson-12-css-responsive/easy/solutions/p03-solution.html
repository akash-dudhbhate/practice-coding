<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluid Heading with clamp()</title>
<style>
  h1 { font-size: clamp(1.5rem, 5vw, 3rem); }
</style>
</head>
<body>
<h1>Responsive Heading</h1>
<p>Resize the browser — heading scales smoothly between 1.5rem and 3rem.</p>
</body>
</html>
