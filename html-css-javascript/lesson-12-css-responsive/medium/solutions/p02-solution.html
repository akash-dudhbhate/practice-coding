<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Nav with Checkbox Hack</title>
<style>
  .nav-toggle { display: none; }
  .nav-links { display: flex; gap: 20px; list-style: none; padding: 0; }
  .hamburger { display: none; cursor: pointer; font-size: 24px; }
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .nav-links { display: none; flex-direction: column; position: absolute; top: 50px; left: 0; right: 0; background: #333; padding: 10px; }
    .nav-toggle:checked ~ .nav-links { display: flex; }
    .nav-links a { color: #fff; text-decoration: none; padding: 8px; }
  }
  nav { position: relative; background: #333; padding: 12px 20px; }
  .nav-links a { color: #fff; text-decoration: none; }
</style>
</head>
<body>
<nav>
  <label class="hamburger" for="nav-toggle">&#9776;</label>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <ul class="nav-links">
    <li><a href="#">Home</a></li><li><a href="#">About</a></li><li><a href="#">Contact</a></li>
  </ul>
</nav>
</body>
</html>
