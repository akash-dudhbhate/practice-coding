<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Landing Page</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; }
  header { display: flex; justify-content: space-between; padding: 16px 20px; background: #333; color: #fff; }
  header nav { display: flex; gap: 20px; }
  header a { color: #fff; text-decoration: none; }
  .hero { text-align: center; padding: 80px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
  .features { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
  .feature { padding: 24px; background: #f9f9f9; border-radius: 8px; text-align: center; }
  @media (min-width: 768px) { .features { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .features { grid-template-columns: repeat(3, 1fr); } }
  .testimonials { padding: 40px 20px; text-align: center; max-width: 800px; margin: 0 auto; }
  footer { background: #333; color: #fff; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header>
  <div>MyBrand</div>
  <nav><a href="#">Home</a><a href="#">Features</a><a href="#">Contact</a></nav>
</header>
<section class="hero"><h1>Build Amazing Things</h1><p>Start your journey today.</p></section>
<section class="features">
  <div class="feature"><h3>Fast</h3><p>Lightning performance.</p></div>
  <div class="feature"><h3>Secure</h3><p>Bank-level security.</p></div>
  <div class="feature"><h3>Reliable</h3><p>99.9% uptime.</p></div>
</section>
<section class="testimonials"><h2>What People Say</h2><p>"Amazing product!" — Happy User</p></section>
<footer>&copy; 2024 MyBrand</footer>
</body>
</html>
