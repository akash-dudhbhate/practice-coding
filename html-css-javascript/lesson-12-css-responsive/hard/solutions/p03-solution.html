<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>
<style>
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; padding: 20px; }
  .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
  .gallery img:hover { transform: scale(1.05); }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
  .lightbox:target { display: flex; }
  .lightbox img { max-width: 90%; max-height: 90%; }
  .close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 30px; text-decoration: none; }
</style>
</head>
<body>
<div class="gallery">
  <a href="#img1"><img src="https://picsum.photos/300/200" alt="1" loading="lazy"></a>
  <a href="#img2"><img src="https://picsum.photos/300/200" alt="2" loading="lazy"></a>
  <a href="#img3"><img src="https://picsum.photos/300/200" alt="3" loading="lazy"></a>
  <a href="#img4"><img src="https://picsum.photos/300/200" alt="4" loading="lazy"></a>
</div>
<div class="lightbox" id="img1"><a class="close" href="#">&times;</a><img src="https://picsum.photos/800/600" alt="1"></div>
<div class="lightbox" id="img2"><a class="close" href="#">&times;</a><img src="https://picsum.photos/800/600" alt="2"></div>
<div class="lightbox" id="img3"><a class="close" href="#">&times;</a><img src="https://picsum.photos/800/600" alt="3"></div>
<div class="lightbox" id="img4"><a class="close" href="#">&times;</a><img src="https://picsum.photos/800/600" alt="4"></div>
</body>
</html>
