<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Dashboard</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  .dashboard { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; transition: grid-template-columns 0.3s; }
  .sidebar { background: #222; color: #fff; padding: 20px; transition: all 0.3s; }
  .sidebar span { display: none; }
  .sidebar .icon { font-size: 20px; }
  .content { padding: 20px; }
  .widgets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .widget { background: #f0f0f0; padding: 20px; border-radius: 8px; }
  @media (max-width: 1024px) {
    .dashboard { grid-template-columns: 60px 1fr; }
    .sidebar span { display: none; }
    .widgets { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .dashboard { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .widgets { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <div class="icon">&#9632; <span>Dashboard</span></div>
    <div class="icon">&#9632; <span>Analytics</span></div>
    <div class="icon">&#9632; <span>Settings</span></div>
  </aside>
  <main class="content">
    <div class="widgets">
      <div class="widget">W1</div><div class="widget">W2</div>
      <div class="widget">W3</div><div class="widget">W4</div>
    </div>
  </main>
</div>
</body>
</html>
