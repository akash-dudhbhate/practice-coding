<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Multi-Theme System</title>
<style>
  :root {
    --bg: #fff; --text: #333; --card-bg: #f0f0f0; --border: #ddd; --link: #0066cc;
  }
  [data-theme="dark"] {
    --bg: #1a1a1a; --text: #f0f0f0; --card-bg: #2a2a2a; --border: #444; --link: #66aaff;
  }
  [data-theme="contrast"] {
    --bg: #000; --text: #fff; --card-bg: #000; --border: #fff; --link: #ffff00;
  }
  body { background: var(--bg); color: var(--text); transition: all 0.3s; font-family: Arial, sans-serif; padding: 20px; }
  .card { background: var(--card-bg); border: 2px solid var(--border); padding: 20px; border-radius: 8px; margin: 10px 0; }
  a { color: var(--link); }
  .switcher button { padding: 8px 16px; margin: 0 4px; cursor: pointer; }
</style>
</head>
<body>
<div class="switcher">
  <button onclick="setTheme('')">Light</button>
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('contrast')">High Contrast</button>
</div>
<div class="card"><p>Theme persists in localStorage. <a href="#">Link example</a></p></div>
<script>
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('theme', t);
  }
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
</script>
</body>
</html>
