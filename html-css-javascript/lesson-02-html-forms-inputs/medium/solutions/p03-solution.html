<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Registration with Validation</title></head>
<body>
<form>
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required><br><br>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" pattern=".+@.+\..+" required><br><br>
  <label for="pwd">Password:</label>
  <input type="password" id="pwd" name="pwd" minlength="8" required><br><br>
  <label for="age">Age:</label>
  <input type="number" id="age" name="age" min="18" max="120" required><br><br>
  <button type="submit">Register</button>
</form>
</body>
</html>
