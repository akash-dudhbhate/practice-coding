<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Survey Form</title></head>
<body>
<form>
  <fieldset>
    <legend>Survey</legend>
    <p>How did you hear about us?</p>
    <label><input type="radio" name="source" value="friend"> Friend</label>
    <label><input type="radio" name="source" value="ad"> Advertisement</label>
    <label><input type="radio" name="source" value="search"> Search Engine</label>
    <p>Which features do you use?</p>
    <label><input type="checkbox" name="features" value="chat"> Chat</label>
    <label><input type="checkbox" name="features" value="email"> Email</label>
    <label><input type="checkbox" name="features" value="video"> Video</label>
    <p>Rate us:</p>
    <select name="rating">
      <option value="5">Excellent</option>
      <option value="4">Good</option>
      <option value="3">Average</option>
      <option value="2">Poor</option>
    </select><br><br>
    <button type="submit">Submit</button>
  </fieldset>
</form>
</body>
</html>
