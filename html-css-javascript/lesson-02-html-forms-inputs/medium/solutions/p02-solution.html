<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Product Order Form</title></head>
<body>
<form>
  <fieldset>
    <legend>Order Product</legend>
    <label for="qty">Quantity:</label>
    <input type="number" id="qty" name="qty" min="1" max="100" value="1"><br><br>
    <label for="size">Size:</label>
    <select id="size" name="size">
      <option value="s">Small</option>
      <option value="m">Medium</option>
      <option value="l">Large</option>
    </select><br><br>
    <p>Extras:</p>
    <label><input type="checkbox" name="extra" value="gift"> Gift Wrap</label>
    <label><input type="checkbox" name="extra" value="express"> Express Shipping</label><br><br>
    <button type="submit">Place Order</button>
  </fieldset>
</form>
</body>
</html>
