<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Checkout Form</title></head>
<body>
<form>
  <fieldset><legend>Shipping Address</legend>
    <label for="sname">Full Name:</label>
    <input type="text" id="sname" required><br><br>
    <label for="saddr">Address:</label>
    <input type="text" id="saddr" required><br><br>
    <label for="scity">City:</label>
    <input type="text" id="scity" required>
    <label for="szip">ZIP:</label>
    <input type="text" id="szip" pattern="[0-9]{6}" required><br><br>
  </fieldset>
  <fieldset><legend>Payment</legend>
    <label for="card">Card Number:</label>
    <input type="text" id="card" pattern="[0-9]{16}" required><br><br>
    <label for="exp">Expiry:</label>
    <input type="month" id="exp" required>
    <label for="cvv">CVV:</label>
    <input type="text" id="cvv" pattern="[0-9]{3}" required><br><br>
  </fieldset>
  <button type="submit">Complete Purchase</button>
</form>
</body>
</html>
