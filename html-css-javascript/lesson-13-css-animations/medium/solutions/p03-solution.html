<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Pulsing Badge</title>
<style>
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
    50% { transform: scale(1.2); box-shadow: 0 0 0 10px rgba(255,0,0,0); }
  }
  .badge {
    width: 20px; height: 20px; background: red;
    border-radius: 50%; color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1.5s infinite;
  }
</style>
</head>
<body>
<div style="position:relative;display:inline-block;padding:20px">
  Notifications <span class="badge">3</span>
</div>
</body>
</html>
