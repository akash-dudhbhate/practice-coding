<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Hamburger to X</title>
<style>
  .menu-toggle { display: none; }
  .hamburger { width: 30px; height: 20px; position: relative; cursor: pointer; }
  .hamburger span {
    display: block; position: absolute; height: 3px; width: 100%;
    background: #333; border-radius: 3px; transition: all 0.3s;
  }
  .hamburger span:nth-child(1) { top: 0; }
  .hamburger span:nth-child(2) { top: 8px; }
  .hamburger span:nth-child(3) { top: 16px; }
  .menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg); top: 8px; }
  .menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  .menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg); top: 8px; }
</style>
</head>
<body>
<label>
  <input type="checkbox" class="menu-toggle">
  <div class="hamburger"><span></span><span></span><span></span></div>
</label>
</body>
</html>
