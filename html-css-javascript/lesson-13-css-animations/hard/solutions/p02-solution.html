<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Card Flip</title>
<style>
  .card-container { width: 200px; height: 200px; perspective: 1000px; cursor: pointer; }
  .card-inner {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform 0.6s;
  }
  .card-container.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px;
  }
  .front { background: #667eea; }
  .back { background: #764ba2; transform: rotateY(180deg); }
</style>
</head>
<body>
<div class="card-container" onclick="this.classList.toggle('flipped')">
  <div class="card-inner">
    <div class="card-face front">Front</div>
    <div class="card-face back">Back</div>
  </div>
</div>
<p>Click the card to flip.</p>
</body>
</html>
