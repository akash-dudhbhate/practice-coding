<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Scroll Animations</title>
<style>
  .fade-in {
    opacity: 0; transform: translateY(40px);
    transition: opacity 0.6s, transform 0.6s;
  }
  .fade-in.visible { opacity: 1; transform: translateY(0); }
  .item { padding: 40px; margin: 20px 0; background: #667eea; color: #fff; text-align: center; }
</style>
</head>
<body>
<div class="item fade-in">Item 1</div>
<div class="item fade-in">Item 2</div>
<div class="item fade-in">Item 3</div>
<div class="item fade-in">Item 4</div>
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
</body>
</html>
